name: Restaurante
options:
  bundleIdPrefix: com.tiki.softrestaurant
targets:
  Restaurante:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/Restaurante
    info:
      properties:
        NSLocalNetworkUsageDescription: "Esta app busca otros iPhones del restaurante en tu WiFi para sincronizar mesas, pedidos e inventario."
        NSCameraUsageDescription: "La cámara se usa para escanear el código de barras de un platillo y agregarlo al pedido."
        NSBonjourServices:
          - _tiki-comanda._tcp
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.tiki.softrestaurant
      SWIFT_VERSION: "5.0"
